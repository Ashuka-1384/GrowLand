<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="GrowLand — Track your growth, build your skills, and prove your progress. The Growth Operating System for ambitious learners."
    />
    <meta property="og:title" content="GrowLand — Growth Dashboard" />
    <meta
      property="og:description"
      content="Track your growth. Build your skills. Prove your progress."
    />
    <meta property="og:type" content="website" />
    <title>GrowLand — Growth Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
  <style>
      #boot-screen {
        min-height: 100vh;
        display: grid;
        place-items: center;
        align-content: center;
        gap: 20px;
        background: #050505;
        color: #fff;
        font-family: Inter, system-ui, sans-serif;
      }
      .boot-screen__mark { text-align: center; }
      .boot-screen__line { display: block; font-weight: 900; letter-spacing: .12em; font-size: 1.4rem; }
      .boot-screen__sub { display: block; margin-top: 6px; color: #6e7681; font: 600 .68rem/1 JetBrains Mono, monospace; letter-spacing: .08em; text-transform: uppercase; }
      .boot-screen__loader { width: 120px; height: 2px; overflow: hidden; background: rgba(255,255,255,.08); border-radius: 99px; }
      .boot-screen__loader span { display: block; width: 45%; height: 100%; background: #00ff88; border-radius: inherit; animation: growlandBoot 1s ease-in-out infinite; }
      @keyframes growlandBoot { 0% { transform: translateX(-120%); } 50% { transform: translateX(100%); } 100% { transform: translateX(240%); } }
      @media (prefers-reduced-motion: reduce) { .boot-screen__loader span { animation: none; width: 100%; } }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="boot-screen" aria-label="Loading GrowLand" role="status">
        <div class="boot-screen__mark">
          <span class="boot-screen__line">GROWLAND</span>
          <span class="boot-screen__sub">Growth Operating System</span>
        </div>
        <div class="boot-screen__loader" aria-hidden="true"><span></span></div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
